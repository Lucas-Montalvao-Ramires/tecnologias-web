<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Itens</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <button onclick="mostrarSecao('cadastro')">Cadastro</button>
    <button onclick="mostrarSecao('listagem')">Listagem</button>
  </nav>

  <section id="cadastro" class="secao">
    <h2>Cadastro de Itens</h2>
    <form id="form-cadastro">
      <input type="text" id="nome" placeholder="Nome do item" required />
      <input type="text" id="descricao" placeholder="Descrição" required />
      <button type="submit">Cadastrar</button>
    </form>
    <p id="erro" class="erro"></p>
  </section>

  <section id="listagem" class="secao" style="display: none;">
    <h2>Itens Cadastrados</h2>
    <ul id="lista-itens"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
